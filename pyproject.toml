[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droidpilot"
version = "0.1.0"
description = "CLI for AI-assisted Android device automation via ADB and uiautomator2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uiautomator2>=3.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
droidpilot = "droidpilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
